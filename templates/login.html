<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Sistema de Farmacia Interactiva</title>
  <style>
    :root {
      --bg: #eef7ff;
      --surface: #ffffff;
      --surface-soft: #f5f9ff;
      --primary: #1d4ed8;
      --secondary: #334155;
      --muted: #64748b;
      --border: #dbeafe;
      --danger: #dc2626;
      --radius: 24px;
      --shadow: 0 24px 64px rgba(15, 23, 42, 0.08);
      --transition: 0.2s ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #f5f9ff 0%, var(--bg) 52%, #e2efff 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid rgba(59, 130, 246, 0.14);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 36px;
    }

    .login-card h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
      text-align: center;
      color: #0f172a;
      line-height: 1.2;
    }

    .login-card .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--secondary);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 1rem;
      color: #0f172a;
      background: var(--surface-soft);
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
    }

    .login-btn {
      width: 100%;
      min-height: 52px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 36px rgba(37, 99, 235, 0.2);
    }

    .login-error {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fef2f2;
      border: 1px solid rgba(220, 38, 38, 0.2);
      color: var(--danger);
      font-size: 0.9rem;
      display: none;
    }

    .login-error.visible { display: block; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>SISTEMA DE FARMACIA INTERACTIVA</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="admin" autocomplete="username" required />
      </div>

      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" class="login-btn">Ingresar</button>
      <div id="login-error" class="login-error" role="alert"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');

    async function iniciarSesion(evento) {
      evento.preventDefault();
      errorEl.classList.remove('visible');

      const usuario = document.getElementById('usuario').value.trim();
      const clave = document.getElementById('clave').value;

      if (!usuario || !clave) {
        errorEl.textContent = 'Ingresa usuario y contraseña.';
        errorEl.classList.add('visible');
        return;
      }

      try {
        const resp = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: usuario, clave: clave })
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'No se pudo iniciar sesión.';
          errorEl.classList.add('visible');
        }
      } catch (err) {
        errorEl.textContent = 'Error de red: ' + err.message;
        errorEl.classList.add('visible');
      }
    }

    form.addEventListener('submit', iniciarSesion);
  </script>
</body>
</html>
